name: check

# Pushes to main and release tags, plus every pull request. Other branches are tested through
# their pull request, so a commit is not tested twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request replaces the run in progress. Main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Repository checks
        run: node app/tests/check-repo.mjs
      - name: Tests
        run: node --test "app/tests/**/*.test.mjs"

  # One result that covers every operating system, for branch protection to require.
  passed:
    name: CI passed
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check succeeded
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = "success"
